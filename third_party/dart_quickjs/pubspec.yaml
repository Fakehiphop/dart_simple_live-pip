name: dart_quickjs
description: QuickJS-ng JavaScript engine bindings for Dart/Flutter.
version: 1.0.0
repository: https://github.com/xiaoyaocz/dart_quickjs
publish_to: none

environment:
  sdk: ^3.10.0

# 本地 vendor 版本：升级到 hooks 2.x / code_assets 1.2.x / hosted native_toolchain_c，
# 以便与 media-kit fork（要求 hooks >=2.0.2）共存于同一依赖图。
# 上游 xiaoyaocz/dart_quickjs 仍使用 hooks 1.x + 自带 native_toolchain_c。
dependencies:
  ffi: ^2.1.0
  code_assets: '>=1.2.1 <3.0.0'
  logging: ^1.2.0
  hooks: '>=2.0.2 <3.0.0'
  native_toolchain_c: '>=0.19.1 <0.20.0'

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  
