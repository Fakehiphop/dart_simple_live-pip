name: simple_live_app
version: 1.13.3+11303
publish_to: none
description: "Simple Live APP"
environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  simple_live_core:
    path: ../simple_live_core
  dart_quickjs:
    path: ../third_party/dart_quickjs
  # 图标
  cupertino_icons: ^1.0.8
  remixicon: ^1.4.1 #Remix图标

  # 框架、工具
  get: ^4.7.3 #状态管理、路由管理、国际化
  dio: ^5.9.0 #网络请求
  hive: 2.2.3 #持久化存储
  hive_flutter: 1.1.0 #持久化存储
  logger: ^2.6.2 #日志
  intl: ^0.20.2 #国际化
  qr_flutter: ^4.1.0 #二维码生成
  dynamic_color: ^1.8.1 #动态颜色
  path: any
  collection: any
  udp: ^5.0.3 #UDP
  uuid: ^4.5.2 #UUID
  webdav_client: ^1.2.2 # WebDAV
  archive: ^4.0.7 #文件压缩
  crypto: ^3.0.7

  #Widget
  flutter_staggered_grid_view: ^0.7.0 #瀑布流/GridView
  flutter_easyrefresh: 2.2.2 #下拉刷新、上拉加载
  extended_image: ^10.0.1 #拓展Image,支持缓存
  flutter_smart_dialog: ^4.9.8+9 #各种弹窗 Toast/Dialog/Popup
  sticky_headers: ^0.3.0+2 #吸顶
  lottie: ^3.3.2 #lottie动画
  canvas_danmaku: ^0.2.7
  # ns_danmaku: #弹幕
  #   git:
  #     url: https://github.com/xiaoyaocz/flutter_ns_danmaku.git
  #     tag: v0.0.9

  #系统交互
  package_info_plus: ^9.0.0 #包信息
  device_info_plus: 12.2.0 #设备信息
  url_launcher: ^6.3.2 #打开链接
  share_plus: ^12.0.1 #分享
  path_provider: ^2.1.5 #常用路径
  cross_file: ^0.3.5 #跨平台文件
  permission_handler: ^12.0.1 #权限处理
  image_gallery_saver_plus: ^4.0.1 #图片保存到相册
  screen_brightness: ^2.1.7 #亮度控制
  auto_orientation_v2: 2.3.8 #屏幕方向
  wakelock_plus: ^1.4.0 #屏幕常亮
  file_picker: ^10.3.7 #文件选择
  window_manager: ^0.5.1 #窗口管理
  screen_retriever: ^0.2.0 #屏幕范围
  floating: ^6.0.0 #PIP画中画
  flutter_inappwebview: ^6.1.5 #WebView
  connectivity_plus: 7.0.0 #网络状态
  qr_code_scanner_plus: ^2.0.14 #二维码扫描
  volume_controller: ^3.4.0 #音量控制

  # 网络相关
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^7.0.0
  web_socket_channel: ^3.0.1 #远程同步WebSocket

  # 视频播放
  # iOS 画中画（PiliPlus 路线，v13）：底座整体换成 PiliPlus 的 media-kit fork
  # （native 分支）。该 fork 的 Darwin 渲染驱动链在退后台后持续推帧，
  # 画中画无需切换渲染管线、无早武装机器（被动帧泵见 ios/Runner/PipPlugin.swift）。
  # libmpv 动态库改由 fork 的 media_kit_libs_* 提供（不再走 build hooks）。
  # media_kit 核心用官方 1.1.11（PiliPlus 的 media_kit fork 改了 Player/Media
  # 的同步 API，simple_live 的播放器代码不兼容；视频输出与事件循环仍用
  # PiliPlus fork，后台渲染修复在那侧）。
  media_kit: 1.1.11
  media_kit_video:
    git:
      url: https://github.com/bggRGjQaUbCoE/media-kit.git
      ref: native
      path: media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      ref: native
      path: libs/universal/media_kit_libs_video

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sherpa_onnx: 1.13.4

dev_dependencies:
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

dependency_overrides:
  sherpa_onnx_ios: 1.13.4
  # 全 PiliPlus 栈：media_kit 核心也用 fork（其 Player/Media API 与官方不同，
  # 上层代码已按 fork API 适配，见 v13.3）。
  media_kit:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      ref: native
      path: media_kit
  # 事件循环与动态库用 PiliPlus fork（后台持续推帧能力的关键）。
  media_kit_native_event_loop:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      ref: native
      path: media_kit_native_event_loop
  media_kit_libs_ios_video:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      ref: native
      path: libs/ios/media_kit_libs_ios_video
  media_kit_libs_android_video:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      ref: native
      path: libs/android/media_kit_libs_android_video
  # fork 的 media_kit_video 依赖 wakelock_plus ^1.4.0，与主工程一致，
  # 原先针对旧 fork 的钉版本覆盖不再需要，但保留主工程版本约束。
  wakelock_plus: ^1.4.0
  # simple_live_core 仍引用 git 版 dart_quickjs（hooks 1.x），会与 media-kit fork
  # 的 hooks >=2.0.2 硬冲突；覆盖为升级过 hooks 的本地 vendor 版。
  dart_quickjs:
    path: ../third_party/dart_quickjs
  canvas_danmaku:
    path: ../third_party/canvas_danmaku
  # media_kit_video 已切换到 sibogentleman/media-kit fork（见 dependencies），
  # 原先本地 vendor 的 ../third_party/media_kit_video（Windows 退出修复）随之移除；
  # 若 Windows 本地构建出现退出崩溃，需要把该修复 rebase 到 fork 上再恢复覆盖。
  media_kit_libs_windows_video:
    path: ../third_party/media_kit_libs_windows_video

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/statement.txt
    - assets/images/
    - assets/images/douyin_emoji/
    - assets/images/douyin_games_webp/
    - assets/icons/
    - assets/lotties/
