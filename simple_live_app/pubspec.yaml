name: simple_live_app
version: 1.13.3+11310
publish_to: none
description: "Simple Live APP"
environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  simple_live_core:
    path: ../simple_live_core
  dart_quickjs:
    path: ../third_party/dart_quickjs
  # 图标
  cupertino_icons: ^1.0.8
  remixicon: ^1.4.1 #Remix图标

  # 框架、工具
  get: ^4.7.3 #状态管理、路由管理、国际化
  dio: ^5.9.0 #网络请求
  hive: 2.2.3 #持久化存储
  hive_flutter: 1.1.0 #持久化存储
  logger: ^2.6.2 #日志
  intl: ^0.20.2 #国际化
  qr_flutter: ^4.1.0 #二维码生成
  dynamic_color: ^1.8.1 #动态颜色
  path: any
  collection: any
  udp: ^5.0.3 #UDP
  uuid: ^4.5.2 #UUID
  webdav_client: ^1.2.2 # WebDAV
  archive: ^4.0.7 #文件压缩
  crypto: ^3.0.7

  #Widget
  flutter_staggered_grid_view: ^0.7.0 #瀑布流/GridView
  flutter_easyrefresh: 2.2.2 #下拉刷新、上拉加载
  extended_image: ^10.0.1 #拓展Image,支持缓存
  flutter_smart_dialog: ^4.9.8+9 #各种弹窗 Toast/Dialog/Popup
  sticky_headers: ^0.3.0+2 #吸顶
  lottie: ^3.3.2 #lottie动画
  canvas_danmaku: ^0.2.7
  # ns_danmaku: #弹幕
  #   git:
  #     url: https://github.com/xiaoyaocz/flutter_ns_danmaku.git
  #     tag: v0.0.9

  #系统交互
  package_info_plus: ^9.0.0 #包信息
  device_info_plus: 12.2.0 #设备信息
  url_launcher: ^6.3.2 #打开链接
  share_plus: ^12.0.1 #分享
  path_provider: ^2.1.5 #常用路径
  cross_file: ^0.3.5 #跨平台文件
  permission_handler: ^12.0.1 #权限处理
  image_gallery_saver_plus: ^4.0.1 #图片保存到相册
  screen_brightness: ^2.1.7 #亮度控制
  auto_orientation_v2: 2.3.8 #屏幕方向
  wakelock_plus: ^1.4.0 #屏幕常亮
  file_picker: ^10.3.7 #文件选择
  window_manager: ^0.5.1 #窗口管理
  screen_retriever: ^0.2.0 #屏幕范围
  floating: ^6.0.0 #PIP画中画
  flutter_inappwebview: ^6.1.5 #WebView
  connectivity_plus: 7.0.0 #网络状态
  qr_code_scanner_plus: ^2.0.14 #二维码扫描
  volume_controller: ^3.4.0 #音量控制

  # 网络相关
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^7.0.0
  web_socket_channel: ^3.0.1 #远程同步WebSocket

  # 视频播放
  # iOS 画中画：media-kit 依赖指 Predidit/media-kit@83b7ca63（Kazumi 作者维护，
  # 无渲染闸门，与 PiliPlus 使用的官方线同源）。libmpv 仍由 Dart build hooks 提供
  # （要求 Flutter >= 3.38 / Dart >= 3.10），不使用 media_kit_libs_* 提供动态库。
  media_kit:
    git:
      url: https://github.com/Fakehiphop/media-kit.git
      ref: 502340f746cbc00c65a5c97275eaa0c60bdc719c
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Fakehiphop/media-kit.git
      ref: 502340f746cbc00c65a5c97275eaa0c60bdc719c
      path: ./media_kit_video

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sherpa_onnx: 1.13.4

dev_dependencies:
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

dependency_overrides:
  sherpa_onnx_ios: 1.13.4
  # fork 的 media_kit_video 钉死 wakelock_plus 1.3.3，与主工程 ^1.4.0 冲突；
  # fork 源码只使用 WakelockPlus.enable/disable（1.4.0 兼容），覆盖为主工程版本。
  wakelock_plus: ^1.4.0
  # simple_live_core 仍引用 git 版 dart_quickjs（hooks 1.x），会与 media-kit fork
  # 的 hooks >=2.0.2 硬冲突；覆盖为升级过 hooks 的本地 vendor 版。
  dart_quickjs:
    path: ../third_party/dart_quickjs
  canvas_danmaku:
    path: ../third_party/canvas_danmaku
  # media_kit_video 已切换到 Predidit/media-kit（见 dependencies），
  # 原先本地 vendor 的 ../third_party/media_kit_video（Windows 退出修复）随之移除；
  # 若 Windows 本地构建出现退出崩溃，需要把该修复 rebase 到 fork 上再恢复覆盖。
  media_kit_libs_windows_video:
    path: ../third_party/media_kit_libs_windows_video

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/statement.txt
    - assets/images/
    - assets/images/douyin_emoji/
    - assets/images/douyin_games_webp/
    - assets/icons/
    - assets/lotties/
